[project]
name = "ave-accounts"
version = "0.1.0"
description = "Service de comptes de l'app AVE grand public : connexion (téléphone+code, Apple, invité) et échange contre des jetons AVE courts. Séparé du moteur."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyjwt[crypto]>=2.8", "cryptography>=42", "cbor2>=5.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
